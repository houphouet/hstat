# =============================================================================
# HStat - integration continue
# -----------------------------------------------------------------------------
# Deux travaux, du plus rapide au plus complet :
#
#   syntaxe  Analyse chaque fichier R sans installer la moindre dependance.
#            Quelques secondes, et attrape une parenthese manquante ou une
#            virgule orpheline avant meme qu'un paquet soit telecharge.
#
#   tests    La suite testthat de reference. On installe une LISTE EXPLICITE
#            de paquets, et non les 87 Imports+Suggests de DESCRIPTION :
#            quelques-uns (torch, prophet) telechargent des runtimes entiers
#            ou exigent une chaine de compilation, et couteraient plus que ce
#            qu'ils apprennent.
#
# Les paquets sont ranges en deux groupes : ceux SANS lesquels la suite ne peut
# pas demarrer, et ceux qui font passer des tests de skip_if_not() a execution
# reelle. Un ajout de test qui exige un nouveau paquet doit l'ajouter ici, sinon
# le test se contentera d'etre saute -- en silence.
#
# CE COMMENTAIRE A MENTI, et il faut dire sur quoi : il annoncait « 107 Imports »
# quand DESCRIPTION en porte 27, et « la suite ne source que Utils.R, mod_ai.R,
# mod_coding.R et mod_qualitative.R » alors qu'elle BALAIE tout le dossier R/
# depuis la migration des modules. Une documentation qui decrit un mecanisme
# disparu se retourne contre celui qui la lit -- ici, elle justifiait une liste
# courte par une couverture qui n'existe plus.
#
# LE SECOND GROUPE EST DONC LARGE, ET C'EST DELIBERE. Le test « tout appel
# qualifie designe un objet qui existe » SAUTE tout paquet absent de la
# machine : mesure faite, 159 appels `pkg::objet` sur 54 paquets n'etaient
# confrontes a l'API reelle NULLE PART. C'est exactement ainsi que
# `PMCMRplus::dunnTest`, `factoextra::fviz_mfa_biplot` et les cinq familles
# fantomes de glmmTMB ont vecu dans le depot -- chacune trouvee le jour ou son
# paquet est devenu installable ici. Ajouter un nom a `souhaites` ne peut pas
# casser la CI (`try()`, puis simple avertissement si l'installation echoue) :
# le seul cout est du temps de telechargement, mis en cache ensuite.
# =============================================================================
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntaxe:
    name: Analyse syntaxique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Analyser tous les fichiers R
        shell: Rscript {0}
        run: |
          fichiers <- c(list.files("inst/app", "\\.R$", full.names = TRUE),
                        list.files("R", "\\.R$", full.names = TRUE),
                        "app.R", "tests/testthat/test-hstat.R")
          fichiers <- fichiers[file.exists(fichiers)]
          echecs <- character(0)
          for (f in fichiers) {
            r <- tryCatch({ parse(f, encoding = "UTF-8"); NULL },
                          error = function(e) conditionMessage(e))
            if (is.null(r)) cat("ok  ", f, "\n")
            else { cat("ECHEC", f, ":", r, "\n"); echecs <- c(echecs, f) }
          }
          cat("\n", length(fichiers) - length(echecs), "/", length(fichiers),
              "fichiers analyses sans erreur\n")
          if (length(echecs)) quit(status = 1)

      - name: Verifier la coherence des versions
        shell: Rscript {0}
        run: |
          # DESCRIPTION fait foi ; README porte le numero en dur (markdown
          # statique) et doit suivre. Un test le verifie deja, mais l'echec est
          # plus lisible ici, avant meme l'installation des paquets.
          v <- unname(read.dcf("DESCRIPTION", "Version")[1, 1])
          rd <- paste(readLines("README.md", warn = FALSE), collapse = "\n")
          cites <- unique(regmatches(rd, gregexpr("Version [0-9]+\\.[0-9]+\\.[0-9]+", rd))[[1]])
          cites <- sub("^Version ", "", cites)
          cat("DESCRIPTION :", v, "| README :", paste(cites, collapse = ", "), "\n")
          if (!length(cites)) { cat("Aucune version citee dans README.md\n"); quit(status = 1) }
          if (!all(cites == v)) {
            cat("Divergence : mettre a jour le bloc de citation du README.\n")
            quit(status = 1)
          }
          cat("Versions coherentes.\n")

  # ===========================================================================
  #  R CMD check : le chemin que la suite ne prend JAMAIS
  # ===========================================================================
  #  `test_dir()` lit les SOURCES ; ce job verifie le paquet INSTALLE. Les deux
  #  ne voient pas les memes defauts, et l'ecart n'est pas theorique : le test
  #  qui garde le repli `ggtext` masquait `requireNamespace` en ecrivant dans
  #  l'environnement de la fonction. Depuis les sources c'est un environnement
  #  de test, donc inscriptible ; sur le paquet installe c'est l'ESPACE DE NOMS,
  #  et il est verrouille. Le test etait vert d'un cote, rouge de l'autre, et
  #  627 tests ne pouvaient pas le dire.
  #
  #  ON N'ECHOUE QUE SUR « ERROR ». L'avertissement et les deux notes sont
  #  connus, expliques et assumes (cf. CLAUDE.md) : caracteres non-ASCII d'une
  #  interface francaise, aiguillages vivant dans `globalenv()` par contrat, et
  #  `Suggests` indisponibles. Faire tomber la CI dessus la ferait desactiver.
  #
  #  `_R_CHECK_FORCE_SUGGESTS_=false` est indispensable : sans lui le check
  #  exige les 60 `Suggests` et refuse de demarrer. C'est ce que font rhub et
  #  CRAN ; le croire bloquant a longtemps fait passer ce check pour impossible.
  #
  #  Les `Imports` sont lus DANS `DESCRIPTION`, jamais recopies ici : une liste
  #  recopiee finit par diverger, et c'est la copie oubliee qui ment.
  check:
    name: R CMD check
    runs-on: ubuntu-latest
    needs: syntaxe
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Bibliotheques systeme
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libtiff5-dev libjpeg-dev \
            libglu1-mesa-dev libglpk-dev

      - name: Cache des paquets R
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-rcheck-${{ hashFiles('DESCRIPTION') }}
          restore-keys: ${{ runner.os }}-rcheck-

      - name: Installer les Imports
        shell: Rscript {0}
        run: |
          d <- read.dcf("DESCRIPTION")
          imp <- sub("\\s*\\(.*", "",
                     trimws(strsplit(d[1, "Imports"], ",")[[1]]))
          imp <- imp[nzchar(imp)]
          cat("Imports declares :", length(imp), "\n")
          # `stats` et `MASS` sont livres avec R : `install.packages()` s'en
          # plaindrait (« is a base package, and should not be updated ») sans
          # rien apporter. On les EXCLUT de l'installation, jamais du controle
          # ci-dessous : ce qui compte est qu'ils soient la, pas qu'on les
          # telecharge.
          livres <- rownames(installed.packages(priority = c("base", "recommended")))
          a_poser <- setdiff(imp, livres)
          cat("a installer :", length(a_poser), "\n")
          # `Imports` est obligatoire : un seul manquant et le check s'arrete
          # sur « Packages required but not available ».
          install.packages(c(a_poser, "testthat"))
          absents <- imp[!vapply(imp, requireNamespace, logical(1), quietly = TRUE)]
          if (length(absents))
            stop("Imports absents, le check ne peut pas demarrer : ",
                 paste(absents, collapse = ", "))

      - name: Construire et verifier
        shell: bash
        run: |
          R CMD build --no-build-vignettes --no-manual .
          tarball=$(ls -t HStat_*.tar.gz | head -1)
          echo "archive : $tarball"
          _R_CHECK_FORCE_SUGGESTS_=false \
            R CMD check --no-manual --no-vignettes "$tarball" || true
          log=$(ls -d *.Rcheck)/00check.log
          echo "::group::00check.log"; cat "$log"; echo "::endgroup::"
          statut=$(grep -E "^Status:" "$log" | tail -1)
          echo "$statut"
          # Seul « ERROR » fait tomber le job : l'avertissement et les notes
          # sont connus et assumes. Les compter pour des echecs ferait
          # desactiver ce job a la premiere note d'une nouvelle version de R.
          if echo "$statut" | grep -q "ERROR"; then
            echo "::error::R CMD check rapporte au moins une ERREUR"
            exit 1
          fi
          echo "Aucune erreur. ($statut)"

  tests:
    name: Suite testthat
    runs-on: ubuntu-latest
    needs: syntaxe
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Bibliotheques systeme
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libtiff5-dev libjpeg-dev \
            libglu1-mesa-dev libglpk-dev
          # DEUX PAQUETS S'INSTALLAIENT SANS POUVOIR SE CHARGER, et la CI le
          # disait dans un `::warning::` que personne ne lit :
          #
          #   heplots -> rgl  -> « libGLU.so.1: cannot open shared object file »
          #   kknn    -> igraph -> GLPK
          #
          # `heplots::boxM` est le test de Box, et son test tournait donc en
          # mode degrade (« Trying without OpenGL ») depuis toujours. Une
          # bibliotheque systeme absente ne se voit pas dans la liste des
          # paquets R : c'est exactement le trou que ce workflow vient de
          # fermer ailleurs, sous une autre forme.

      - name: Cache des paquets R
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('.github/workflows/tests.yml') }}
          restore-keys: ${{ runner.os }}-r-

      - name: Installer les paquets
        shell: Rscript {0}
        run: |
          # Indispensables : sans eux la suite ne demarre pas.
          requis <- c("testthat", "shiny", "shinydashboard")
          # Facultatifs : leur absence transforme des tests reels en tests
          # sautes. On les veut donc presents, mais leur echec d'installation
          # ne doit pas faire tomber la CI.
          souhaites <- c("ggplot2", "ggrepel", "DT", "dplyr", "FactoMineR",
                         "openxlsx", "jsonlite", "httr", "car", "svglite",
                         "scales", "base64enc", "readxl", "writexl",
                         # ggtext arrivait lui aussi par dependance
                         # transitive. Sept modules l'appellent pour leurs
                         # titres d'axe ; son absence ne fait plus tomber le
                         # graphique (repli sur element_text), mais elle
                         # laisserait la branche markdown NON TESTEE -- et un
                         # test qui n'exerce plus rien ressemble a un test qui
                         # passe. On le nomme.
                         "ggtext",
                         # Post-hoc : ils arrivaient jusqu'ici comme dependances
                         # transitives, donc par chance. Une reconstruction du
                         # cache les ferait disparaitre, et les tests qui
                         # gardent la protection des lettres se sauteraient EN
                         # SILENCE -- un test saute ressemble a un test qui
                         # passe. On les nomme.
                         "agricolae", "PMCMRplus", "multcompView", "emmeans",
                         # vegan : le socle de diversite ne l'APPELLE pas -- il
                         # calcule tout en R de base, pour que les indices ne
                         # dependent d'aucun paquet. Mais le test qui confronte
                         # Shannon, Simpson, Chao1, ACE, la rarefaction et les
                         # cinq coefficients beta a vegan se sauterait sans lui,
                         # et un test saute ressemble a un test qui passe.
                         "vegan",
                         # dlnm et survival : le module d'epidemiologie les
                         # appelle vraiment (surface exposition-retard, Cox,
                         # Kaplan-Meier). Sans eux les tests qui confrontent le
                         # DLNM a un effet simule, et le Cox au paquet de
                         # reference, se sauteraient EN SILENCE -- et un test
                         # saute ressemble a un test qui passe. `survival` est
                         # recommande donc presque toujours la, ce qui est
                         # precisement la raison de le nommer : ce qui n'est pas
                         # declare n'est pas garanti.
                         "dlnm", "survival",
                         # duckdb, lmerTest, sandwich : SIX tests les exigent
                         # -- quatre sur le chemin hors-memoire, un sur le
                         # bouton LMM qui doit imposer la gaussienne, un sur la
                         # variance robuste confrontee au paquet de reference.
                         # Aucun des trois n'etait nomme ici, donc ces six
                         # tests se sautaient EN SILENCE en CI comme en local
                         # -- et un test saute ressemble a un test qui passe.
                         # Meme raison que pour agricolae et vegan : ce qui
                         # n'est pas declare n'est pas garanti.
                         "duckdb", "lmerTest", "sandwich",
                         # Ferme le trou mesure plus haut : ces paquets sont
                         # appeles par `pkg::` dans le code et n'etaient
                         # verifies nulle part. `torch` et `prophet` restent
                         # dehors -- le premier telecharge libtorch, le second
                         # une chaine Stan ; tous deux couteraient plus de
                         # minutes que de symboles gardes.
                         "factoextra", "forecast", "plotly", "psych", "lavaan",
                         "pwr", "shinyjs", "shinyWidgets", "shinyalert",
                         "shinycssloaders", "colourpicker", "sortable",
                         "DBI", "dlm", "glmmTMB", "rlang", "lmtest", "lme4",
                         "htmltools", "tidyr", "tibble", "magrittr",
                         "RColorBrewer", "corrplot", "patchwork", "treemapify",
                         "mclust", "pROC", "randomForest", "xgboost", "e1071",
                         "pls", "mice", "missForest", "VIM", "kknn", "klaR",
                         "glmnet", "dbscan", "heplots", "multcomp", "FSA",
                         "rcompanion", "EMT", "bestNormalize", "afex",
                         "ARTool", "clustMixType", "poLCA", "neuralnet",
                         "haven", "data.table", "zip")
          install.packages(requis)
          manquants <- requis[!vapply(requis, requireNamespace, logical(1), quietly = TRUE)]
          if (length(manquants))
            stop("Paquets indispensables absents : ", paste(manquants, collapse = ", "))
          try(install.packages(souhaites), silent = TRUE)
          absents <- souhaites[!vapply(souhaites, requireNamespace, logical(1), quietly = TRUE)]
          if (length(absents))
            cat("::warning::Paquets facultatifs absents, des tests seront sautes : ",
                paste(absents, collapse = ", "), "\n", sep = "")

      - name: Lancer la suite
        shell: Rscript {0}
        run: |
          # test_dir("tests/testthat") et non "tests" : testthat traiterait
          # aussi tests/testthat.R comme une suite, or son library(HStat)
          # echoue tant que le paquet n'est pas installe.
          res <- testthat::test_dir("tests/testthat", stop_on_failure = FALSE,
                                    reporter = "summary")
          df <- as.data.frame(res)
          cat(sprintf("\nassertions : %d | echecs : %d | erreurs : %d | sautes : %d\n",
                      sum(df$passed), sum(df$failed), sum(df$error), sum(df$skipped)))
          if (sum(df$failed) + sum(df$error) > 0) quit(status = 1)
